<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Page Not Found | Milne Masonry</title>
        <meta name="robots" content="noindex, follow" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <meta name="theme-color" content="#1a1d23" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=Inter:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                color-scheme: dark;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                font-family: Inter, system-ui, sans-serif;
                color: #e8e4de;
                background: linear-gradient(
                    135deg,
                    #1a1d23 0%,
                    #22262e 50%,
                    #2d323c 100%
                );
            }

            .wrap {
                max-width: 560px;
                text-align: center;
            }

            .code {
                font-family: Syne, sans-serif;
                font-weight: 700;
                font-size: 14px;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: #60a5fa;
                margin-bottom: 20px;
            }

            h1 {
                font-family: Syne, sans-serif;
                font-weight: 700;
                font-size: clamp(28px, 6vw, 44px);
                line-height: 1.15;
                margin: 0 0 20px;
                color: #fff;
            }

            p {
                font-size: 18px;
                line-height: 1.6;
                color: #9ca3af;
                margin: 0 0 32px;
            }

            .actions {
                display: flex;
                flex-wrap: wrap;
                gap: 16px;
                justify-content: center;
            }

            a.btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 14px 28px;
                border-radius: 8px;
                font-weight: 600;
                text-decoration: none;
                transition: background 0.2s ease;
            }

            a.primary {
                background: #3b82f6;
                color: #fff;
            }

            a.primary:hover {
                background: #2563eb;
            }

            a.secondary {
                border: 1px solid rgba(255, 255, 255, 0.2);
                color: #fff;
            }

            a.secondary:hover {
                background: rgba(255, 255, 255, 0.05);
            }

            .contact {
                margin-top: 40px;
                font-size: 14px;
                color: #6b7280;
            }

            .contact a {
                color: #9ca3af;
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <p class="code">Error 404</p>
            <h1>This page isn't here.</h1>
            <p>
                The link may be out of date, or the address may have a typo in
                it. The main site has our work, our approach, and a way to
                reach us.
            </p>
            <div class="actions">
                <a class="btn primary" href="/">Back to Milne Masonry</a>
                <a class="btn secondary" href="/#contact">Request a Bid</a>
            </div>
            <p class="contact">
                Or call us directly at
                <a href="tel:5036586444">503.658.6444</a>
            </p>
        </div>
    </body>
</html>
